
name: Build NexGuard

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cai Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bien dich
        run: gradle clean build

      - name: Doi ten JAR
        run: |
          mkdir -p release
          cp build/libs/*.jar release/NexGuard-AntiCheat-1.0.2.jar

      - name: Luu JAR
        uses: actions/upload-artifact@v4
        with:
          name: NexGuard-AntiCheat-1.0.2
          path: release/NexGuard-AntiCheat-1.0.2.jar
