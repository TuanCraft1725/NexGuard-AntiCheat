
name: Build NexGuard

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Kiem tra Gradle
        run: gradle --version

      - name: Bien dich NexGuard
        run: gradle clean build --no-daemon

      - name: Dong goi JAR
        run: |
          mkdir -p release
          cp build/libs/*.jar release/NexGuard-AntiCheat-1.0.2.jar

      - name: Luu file JAR
        uses: actions/upload-artifact@v4
        with:
          name: NexGuard-AntiCheat-1.0.2
          path: release/NexGuard-AntiCheat-1.0.2.jar
