
general:
  language: vi
  debug: false
  prefix: "&b&lNEXGUARD &8» "

autoclicker:
  max-cps: 24
  measurement-window-ms: 1000

ping-protection:
  enabled: true
  max-ping: 5000
  kick-message: "Ping quá cao!"

checks:
  autoclicker:
    enabled: true
  speed:
    enabled: true
  fastplace:
    enabled: false
    max-per-second: 20
    alert-interval-ms: 3000
  scaffold:
    enabled: false
    min-pitch: 58.0
    min-horizontal-movement: 0.10
    required-signals: 6

  # Các bộ kiểm tra đang chờ triển khai
  reach:
    enabled: false
  killaura:
    enabled: false
  fly:
    enabled: false
  nofall:
    enabled: false
  jesus:
    enabled: false
  noslow:
    enabled: false

violations:
  enabled: true
  max-vl: 100
  autoban: false
  autoban-threshold: 50
  autoclear:
    enabled: true
    interval-seconds: 300

alerts:
  enabled: true
  permission: "nexguard.alerts"
  show:
    player: true
    check: true
    violations: true
    vl: true
    ping: true
  cooldown-seconds: 2

logging:
  enabled: true
  console: true
  file: true
  filename: "violations.log"

security:
  telemetry: false
  external-connections: false
  debug-logging: false
